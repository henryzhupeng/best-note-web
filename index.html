<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4070f4" />
  <meta name="description" content="优记 BestNote - 免注册、本地存储的网页 AI 笔记，把图片、OCR 和粘贴文字整理成结构化笔记。" />
  <title>优记 BestNote · 网页 AI 笔记</title>
  <link rel="stylesheet" href="./styles.css?v=7.19" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="./icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#" data-route="home" aria-label="优记首页">
        <span class="brand-mark">优</span>
        <span>
          <strong>优记</strong>
          <small>BestNote</small>
        </span>
      </a>

      <nav class="side-nav">
        <button class="nav-item" data-route="home">
          <span class="nav-icon">⌂</span><span>首页</span>
        </button>
        <button class="nav-item" data-route="paste">
          <span class="nav-icon">✦</span><span>AI 结构化</span>
        </button>
        <button class="nav-item" data-route="import">
          <span class="nav-icon">◫</span><span>图片整理</span>
        </button>
        <button class="nav-item" data-route="ocr">
          <span class="nav-icon">⌘</span><span>OCR 提取</span>
        </button>
        <button class="nav-item" data-route="notes">
          <span class="nav-icon">▤</span><span>全部笔记</span>
        </button>
        <button class="nav-item" data-route="examples">
          <span class="nav-icon">✦</span><span>示例中心</span>
        </button>
        <button class="nav-item" data-route="history">
          <span class="nav-icon">↺</span><span>版本历史</span>
        </button>
        <button class="nav-item" data-route="backup">
          <span class="nav-icon">⛨</span><span>数据备份</span>
        </button>
      </nav>

      <div class="side-bottom">
        <div class="privacy-card">
          <span class="privacy-icon">◉</span>
          <div>
            <strong>本地优先</strong>
            <p>笔记保存在当前浏览器，不上传服务器。</p>
          </div>
        </div>
        <button class="install-button" type="button" data-install-app>⤓ 安装到手机 / 桌面</button>
        <p class="version">Web Prototype · v7.19</p>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <a class="workspace-brand" href="#" data-route="workspace" aria-label="优记工作台">
          <svg class="workspace-logo" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M20 3.5 34.5 11.8v16.4L20 36.5 5.5 28.2V11.8L20 3.5Z" />
            <path class="workspace-logo-check" d="m13.2 20.2 4.5 4.5 9-10" />
          </svg>
          <span><strong>优记</strong><small>BestNote</small></span>
        </a>
        <div class="workspace-top-actions">
          <button class="top-action-primary" type="button" data-mobile-import="gallery" id="top-ocr-button"><span class="top-action-icon">＋</span><span id="top-ocr-label">上传图片 OCR</span></button>
          <button class="top-action-secondary" type="button" data-workspace-new>新建笔记</button>
        </div>
        <button class="mobile-brand" data-route="home" aria-label="返回首页">
          <span class="brand-mark small">优</span>
          <strong>优记</strong>
        </button>
        <label class="global-search" for="global-search-input">
          <span>⌕</span>
          <input id="global-search-input" type="search" placeholder="搜索笔记、标签或内容…" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>
        <span id="save-status" class="save-status">已自动保存</span>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深浅主题" title="切换深浅主题">◐</button>
        <button class="install-top-button" type="button" data-install-app aria-label="安装优记" title="安装到手机或桌面">⤓</button>
        <button class="trash-button" type="button" data-route="trash" aria-label="打开回收站">
          <span>♲</span>
          <small id="trash-count" class="trash-count hidden">0</small>
        </button>
        <button class="avatar" type="button" title="本地用户">优</button>
      </header>

      <div id="view-root" class="view-root" aria-live="polite"></div>
    </main>

    <nav class="bottom-nav" aria-label="移动端导航">
      <button data-route="home"><span>⌂</span><small>首页</small></button>
      <button class="primary-nav" data-route="paste"><span>✦</span><small>AI 结构化</small></button>
      <button data-route="notes"><span>▤</span><small>笔记</small></button>
    </nav>
  </div>

  <input id="mobile-camera-input" type="file" accept="image/*" capture="environment" hidden />
  <input id="mobile-gallery-input" type="file" accept="image/*" multiple hidden />
  <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
  <div id="modal-root"></div>

  <script src="./app.js?v=7.19"></script>
</body>
</html>

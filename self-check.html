<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>优记 · 功能自检</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #17201d; background: #f3f5f2; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 90% 0%, #fff0df, transparent 34%), #f3f5f2; }
    main { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    h1 { margin: 4px 0 8px; font-size: clamp(28px, 5vw, 46px); letter-spacing: -.04em; }
    p { margin: 0; color: #66716c; line-height: 1.75; }
    .eyebrow { color: #0f766e; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .button { display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border: 1px solid #dfe6e1; border-radius: 12px; background: #fff; color: #0f766e; font-size: 13px; font-weight: 750; text-decoration: none; cursor: pointer; }
    .button.primary { border-color: #0f766e; background: #0f766e; color: #fff; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
    .summary div { padding: 18px; border: 1px solid #dfe6e1; border-radius: 16px; background: rgba(255,255,255,.8); }
    .summary strong { display: block; font-size: 27px; }
    .summary span { color: #7a8580; font-size: 12px; }
    .results { display: grid; gap: 10px; }
    .test { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 15px 16px; border: 1px solid #dfe6e1; border-radius: 14px; background: #fff; }
    .status { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 9px; background: #eef2ee; font-size: 13px; font-weight: 900; }
    .test.pass .status { background: #dff3ef; color: #0a5a54; }
    .test.fail .status { background: #fdebea; color: #c2413b; }
    .test.running .status { background: #fff1e3; color: #a95818; }
    .test strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .test p { font-size: 12px; }
    .test small { color: #8c9691; font-size: 11px; white-space: nowrap; }
    .note { margin-top: 18px; padding: 16px; border: 1px solid #efd7b4; border-radius: 14px; background: #fff9ef; color: #6e5a43; font-size: 12px; line-height: 1.7; }
    iframe { position: fixed; width: 1px; height: 1px; opacity: .001; pointer-events: none; }
    @media (max-width: 700px) { header { align-items: flex-start; flex-direction: column; } .summary { grid-template-columns: 1fr; } .test { grid-template-columns: auto minmax(0, 1fr); } .test small { grid-column: 2; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">BestNote v7.20 · Local quality gate</div>
        <h1>功能自检</h1>
        <p>不依赖云端 OCR。这里检查标题相关性、模板推荐、表格合并、时间纠正、无关内容过滤、IndexedDB、HTML 安全和示例完整性。</p>
      </div>
      <div class="actions">
        <button class="button primary" id="rerun">重新运行</button>
        <a class="button" href="./index.html?route=examples">返回示例中心</a>
      </div>
    </header>
    <section class="summary" aria-label="自检汇总">
      <div><strong id="total">0</strong><span>测试项</span></div>
      <div><strong id="passed">0</strong><span>通过</span></div>
      <div><strong id="failed">0</strong><span>失败</span></div>
    </section>
    <section class="results" id="results" aria-live="polite"></section>
    <div class="note">说明：这是面向当前 Web 原型的交互自检，不代表真实图片 OCR 的绝对准确率。真实图片仍建议用“示例图片”和你的截图分别验证，并在发布前执行 REGRESSION_CHECKLIST.md。</div>
  </main>
  <iframe id="app-frame" src="./index.html?selftest=1" title="自检运行环境"></iframe>
  <script src="./self-check.js"></script>
</body>
</html>
